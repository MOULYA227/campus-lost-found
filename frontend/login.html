<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to CampusFind to report items and manage your claims.">
  <title>Login — CampusFind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo"><span>🎒</span> CampusFind</a>
      <div class="nav__links">
        <a href="index.html">Home</a>
        <a href="report.html">Report Item</a>
        <a href="reports.html">Browse</a>
        <a href="match.html">Matches</a>
        <div class="nav__auth" id="nav-auth"></div>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1>Welcome Back</h1>
      <p>Log in to CampusFind to report items, claim belongings, and track your requests.</p>
    </div>
  </div>

  <main class="container">
    <div class="auth-card">
      <form id="login-form" novalidate>

        <div class="form-group">
          <label for="login-email">Email Address *</label>
          <input type="email" id="login-email" name="email"
                 placeholder="your@campus.edu" required
                 autocomplete="email">
        </div>

        <div class="form-group">
          <label for="login-password">Password *</label>
          <input type="password" id="login-password" name="password"
                 placeholder="Your password" required
                 autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="login-submit-btn">
          <div class="spinner"></div>
          <span class="btn-text">Log In</span>
        </button>
      </form>

      <p class="auth-switch">
        New here? <a href="register.html">Create a free account →</a>
      </p>
    </div>
  </main>

  <footer>
    <strong>CampusFind</strong> — Smart Campus Lost &amp; Found &nbsp;|&nbsp;
    Built with ❤️ for RubiX 2026 · NISB Computer Society
  </footer>
  <script src="script.js"></script>
</body>
</html>
